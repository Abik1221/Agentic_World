version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_interface: true            # generate a Querier interface (mockable)
        emit_exact_table_names: false
# No queries exist yet (Stage 0). `make gen` becomes meaningful once Stage 1+ add
# .sql query files under internal/store/queries/. Until then this config is the
# contract for how typed, compile-checked DB access will be generated.
