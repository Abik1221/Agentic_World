version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - revive
    - sqlclosecheck
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversions are reviewed at money boundaries explicitly
        - G704 # SSRF false positive: the Stripe base URL is trusted config, not user input
        - G118 # detached match goroutines (pushplay) intentionally use context.Background:
                # they must OUTLIVE the request — the request ctx would cancel the match
                # the moment the HTTP handler returns.
        - G505 # crypto/sha1 is mandated by TOTP (RFC 6238); the import is required, not weak usage.
    revive:
      rules:
        - name: exported
          disabled: false
          # Domain-prefixed exported names (mafia.MafiaPushView, rating.RatingState)
          # read clearly across packages and are intentional; the stutter nag is noise.
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - bodyclose # websocket.Dial test bodies; body-leak checks matter on prod request paths, not short-lived tests
        path: _test\.go
      # QF* are staticcheck "quickfix" style suggestions (tagged switch, De Morgan,
      # Fprintf-over-WriteString, drop-embedded-field) that golangci-lint v2 turns on
      # by default; they were not part of the v1 lint scope and are stylistic only.
      - linters:
          - staticcheck
        text: "QF[0-9]+"
      # cmd/* are one-shot dev tools that exit via log.Fatal on error; a deferred
      # cancel not running before process exit is harmless there.
      - linters:
          - gocritic
        text: "exitAfterDefer"
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
