# Local development stack: Postgres + Redis + the Agent Arena server.
# Usage: `make compose-up` (from repo root) → service on http://localhost:8080.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migrator: applies migrations/ then exits. The server waits on it.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["../migrations:/migrations:ro"]
    command:
      [ "-path", "/migrations",
        "-database", "postgres://arena:arena@postgres:5432/arena?sslmode=disable",
        "up" ]

  server:
    build:
      context: ..
      dockerfile: Dockerfile
      args: { VERSION: dev-compose }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      ENV: local
      PORT: "8080"
      DATABASE_URL: postgres://arena:arena@postgres:5432/arena?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: dev-only-change-me-32-bytes-minimum!!
      API_KEY_PEPPER: dev-only-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      # Social login (optional locally). Set these in a .env next to this file (or your
      # shell) to enable the buttons; unset ⇒ that provider's endpoint returns 503.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports: ["8090:8080"]

volumes:
  pgdata:
