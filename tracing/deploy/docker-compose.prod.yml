# Production overlay for the Pyyol Lens stack.
#
# Usage (on the host, from tracing/):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env up -d
#
# Images are built + pushed by CI (deploy-tracing.yml) and pulled here — never
# built on the server. LENS_BACKEND_IMAGE / LENS_WEB_IMAGE are pinned SHA tags.
#
# What it changes vs the base compose:
#   • Pins registry images (same pattern as Super Admin ADMIN_*_IMAGE).
#     pull_policy is `missing` (not `always`): CI `compose pull`s while logged in,
#     then logs out so the Hub token is not left on the VPS. `always` made the
#     following `up` re-pull the private repo unauthenticated → "pull access denied".
#   • Attaches ingest-api + query-api to the shared external `pyyol` network so
#     the arena (arena-server) can POST telemetry to pyyol-lens-ingest:8081 and
#     the Super_Admin API + this web app can read pyyol-lens-query:8082.
#   • Enforces the query-api shared-secret gate (QUERY_API_KEY) and a real
#     INGEST_API_KEY — both fail closed in production.
#   • Binds the web dashboard to loopback (an nginx/Caddy vhost fronts it) and
#     requires a dashboard login.
# Everything else (ClickHouse, NATS, processor, control) stays internal to the
# base project network and is never exposed publicly. Migrations apply in-process
# on the processor's boot (no manual step).

services:
  ingest-api:
    image: ${LENS_BACKEND_IMAGE:-pyyol-lens-backend:latest}
    pull_policy: missing
    build: !reset

    # Reached by the arena via pyyol (pyyol-lens-ingest:8081); loopback publish is
    # only for host-side health checks — never world-exposed.
    ports: !override
      - "127.0.0.1:8081:8081"
    environment:
      PYYOL_LENS_ENV: production
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY (must equal the arena PYYOL_LENS_API_KEY)}
      # Rate limit backstop behind the key: bounds how fast an unauthenticated caller can
      # guess it, and how much a LEAKED key can bury the trace store in forged spans
      # before anyone notices. Keyed on the nginx-observed hop (TRUSTED_PROXY_COUNT from
      # the right), never on the client-settable left-most X-Forwarded-For entry.
      # Raise RATE_LIMIT_PER_MINUTE if a legitimate producer is ever throttled.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    networks: [default, pyyol]
    restart: always

  query-api:
    image: ${LENS_BACKEND_IMAGE:-pyyol-lens-backend:latest}
    pull_policy: missing
    build: !reset

    # Reached by the admin + web via pyyol (pyyol-lens-query:8082); loopback only.
    ports: !override
      - "127.0.0.1:8082:8082"
    environment:
      PYYOL_LENS_ENV: production
      QUERY_API_KEY: ${QUERY_API_KEY:?set QUERY_API_KEY (must equal admin LENS_API_KEY + web PYYOL_LENS_API_KEY)}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    networks: [default, pyyol]
    restart: always

  processor:
    image: ${LENS_BACKEND_IMAGE:-pyyol-lens-backend:latest}
    pull_policy: missing
    build: !reset

    environment:
      PYYOL_LENS_ENV: production
    restart: always

  # Base compose publishes these on 0.0.0.0 for local dev. Compose APPENDS port
  # lists on merge, so without !override a prod deploy would still bind ClickHouse,
  # NATS, MinIO, and the dashboard on all interfaces — and 0.0.0.0:3100 can collide
  # with whatever else lives on this VPS (Mega Hub is on :80/:443; we stay off those).
  clickhouse:
    ports: !override []
  postgres:
    ports: !override []
  nats:
    ports: !override []
  minio:
    ports: !override []
  control-api:
    image: ${LENS_BACKEND_IMAGE:-pyyol-lens-backend:latest}
    pull_policy: missing
    build: !reset

    ports: !override []
    environment:
      PYYOL_LENS_ENV: production
      QUERY_API_KEY: ${QUERY_API_KEY:?set QUERY_API_KEY}
    restart: always

  web:
    image: ${LENS_WEB_IMAGE:-pyyol-lens-web:latest}
    pull_policy: missing
    build: !reset

    ports: !override
      - "127.0.0.1:3100:3100" # loopback — host nginx, if it owns :80
      - "0.0.0.0:${TRACE_PUBLIC_PORT:-3110}:3100" # dedicated public port; Mega Hub keeps :80/:443
    environment:
      PYYOL_LENS_QUERY_URL: http://pyyol-lens-query:8082
      PYYOL_LENS_CONTROL_URL: http://pyyol-lens-control:8083
      PYYOL_LENS_INGEST_URL: http://pyyol-lens-ingest:8081
      PYYOL_LENS_API_KEY: ${QUERY_API_KEY:?set QUERY_API_KEY}
      PYYOL_LENS_DEFAULT_ORG_ID: ${PYYOL_LENS_DEFAULT_ORG_ID:-pyyol}
      PYYOL_LENS_ALLOW_DIRECT_FALLBACK: "true"
      # Arena admin API (queue health). Separate from Lens; this dashboard login is
      # not an arena admin session, so the page must render unauthorized honestly.
      PYYOL_API_URL: ${PYYOL_API_URL:-http://arena-server:8080}
      PYYOL_LENS_AUTH_USER: ${PYYOL_LENS_AUTH_USER:-admin}
      PYYOL_LENS_AUTH_PASSWORD: ${PYYOL_LENS_AUTH_PASSWORD:?set a dashboard password}
      PYYOL_LENS_SESSION_SECRET: ${PYYOL_LENS_SESSION_SECRET:?set a session secret}
    networks: [default, pyyol]
    restart: always

# Shared cross-repo network (created by the arena deploy; created here too if the
# tracing stack deploys first). external:true ⇒ it is not owned by this project.
networks:
  pyyol:
    external: true
    name: pyyol
