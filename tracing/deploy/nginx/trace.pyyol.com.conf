# trace.pyyol.com — Pyyol Eye (telemetry dashboard).
#
# MUST NOT be default_server. Mega Hub shares this origin; unmatched Host headers
# used to fall through to Mega Hub's default vhost. This file is an exact-name
# vhost so only Host/SNI trace.pyyol.com is routed here.
#
# Upstream: tracing compose service `web` on 127.0.0.1:3100 (loopback only).
# Installed by deploy/install-trace-vhost.sh on every tracing deploy.

server {
    listen 80; listen [::]:80;
    server_name trace.pyyol.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name trace.pyyol.com;

    ssl_certificate     /etc/letsencrypt/live/trace.pyyol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trace.pyyol.com/privkey.pem;

    client_max_body_size 25m;

    # Do not send Connection: upgrade. That held POST /api/auth/login open until
    # Cloudflare 522/524. Eye has no WebSockets, so a normal hop is enough.
    # Mega Hub's nginx.conf only includes this file (not conf.d/*.conf), so
    # $connection_upgrade is an unknown variable and nginx -t would refuse reload.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
