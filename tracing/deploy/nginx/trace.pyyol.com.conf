# trace.pyyol.com — Pyyol Lens observability UI.
#
# The UI container (tracing compose service `web`) listens on 3100 and proxies to
# query-api / control-api SERVER-SIDE over the compose network, so this single
# upstream is all nginx needs to front. Bind the container to 127.0.0.1:3100 (see
# deploy/docker-compose.trace.yml) so the dashboard is only reachable through this
# TLS vhost, never directly on the public port.
#
# Place at /etc/nginx/sites-available/trace.pyyol.com.conf and symlink into
# sites-enabled; issue the cert with `certbot --nginx -d trace.pyyol.com`.

server {
    listen 80;
    listen [::]:80;
    server_name trace.pyyol.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trace.pyyol.com;

    ssl_certificate     /etc/letsencrypt/live/trace.pyyol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trace.pyyol.com/privkey.pem;

    # Observability data is sensitive — keep the dashboard private. Primary gate is
    # the app login (PYYOL_LENS_AUTH_PASSWORD). Uncomment for defense-in-depth:
    # auth_basic           "Pyyol Lens";
    # auth_basic_user_file /etc/nginx/.htpasswd-trace;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live trace stream uses WebSocket / SSE — allow upgrades, disable buffering,
        # and permit long-lived reads.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
