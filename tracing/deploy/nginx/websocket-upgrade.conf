# Defines $connection_upgrade for reverse-proxying. Must load in http {}
# (conf.d), not inside a server block. Same map admin.pyyol.com already uses;
# skip install if nginx -T already has it (duplicate map is a hard error).
#
# Without this, proxy_set_header Connection "upgrade" on every request (including
# POST /api/auth/login) holds the hop open as a WebSocket. Cloudflare then 522/524s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
