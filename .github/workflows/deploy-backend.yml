name: deploy-backend

# CI + CD for the Agent Arena backend → Hostinger VPS.
#
# Flow on every push to main (or manual dispatch):
#   1. test  — go build + vet + race tests. Deploy is gated on this (fail = no deploy).
#   2. deploy — build the distroless server image and PUSH it to the private Docker
#      Hub repo (DOCKERHUB_REPO:<sha> + :latest); ship only the compose file + the
#      prod .env (generated from GitHub Secrets) over SSH; the server logs in to the
#      registry, `docker compose pull`s the pinned image, logs out, and `up -d`. The
#      server applies DB migrations in-process on boot (AUTO_MIGRATE=true), then we
#      poll /readyz until DB + Redis are healthy (i.e. migrations succeeded).
#
# Required GitHub Secrets. SSH: DEPLOY_SSH_KEY, SSH_HOST, SSH_USER, SSH_PORT.
# Registry: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_REPO (e.g. nahi12/pyyol_backend).
# App secrets: POSTGRES_PASSWORD, JWT_SIGNING_KEY, API_KEY_PEPPER, … (full list below).

on:
  push:
    branches: [main] # any push to main auto-deploys (build in CI → pull on server)
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

env:
  # The image ref is DOCKERHUB_REPO:<sha>, built + pushed then pulled on the server.
  REMOTE_DIR: "/opt/agent-arena"

jobs:
  # ── CI gate: must pass before anything is deployed ──────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...

  # ── CD: build → ship → migrate-on-boot → healthcheck ────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Build, tag, and push image to Docker Hub (private)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_REPO:?DOCKERHUB_REPO secret is required}"
          SHA="${GITHUB_SHA::12}"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          # One shared private repo, per-service tag prefix (arena-*).
          docker build -f backend/Dockerfile \
            -t "$DOCKERHUB_REPO:arena-$SHA" -t "$DOCKERHUB_REPO:arena-latest" \
            --build-arg VERSION="$SHA" backend
          docker push "$DOCKERHUB_REPO:arena-$SHA"
          docker push "$DOCKERHUB_REPO:arena-latest"
          docker logout
          # Pin the deploy to this immutable SHA tag (consumed by the .env step).
          echo "IMAGE_REF=$DOCKERHUB_REPO:arena-$SHA" >> "$GITHUB_ENV"

      - name: Generate prod .env from secrets
        env:
          ARENA_PORT: ${{ secrets.ARENA_PORT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          BASE_URL_S: ${{ secrets.BASE_URL }}
          CORS_S: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          # Session TTLs — short access JWT + long rotating refresh (industry-standard
          # sliding session). Configured via secrets, never hardcoded. Defaults below
          # if unset: 1h access / 720h (30d) refresh.
          DASHBOARD_TOKEN_TTL: ${{ secrets.DASHBOARD_TOKEN_TTL }}
          REFRESH_TOKEN_TTL: ${{ secrets.REFRESH_TOKEN_TTL }}
          AGENT_ENDPOINT_SECRET_KEY: ${{ secrets.AGENT_ENDPOINT_SECRET_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          # The operator login, seeded at boot. Secrets, not literals — see the .env block.
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_ADMIN_USER_ID: ${{ secrets.SEED_ADMIN_USER_ID }}
          # Several operators, as one JSON list. See the .env block below.
          SEED_ADMIN_OPERATORS: ${{ secrets.SEED_ADMIN_OPERATORS }}
          PLATFORM_ENGINE_PRIVATE_KEY: ${{ secrets.PLATFORM_ENGINE_PRIVATE_KEY }}
          PLATFORM_ADMIN_PUBLIC_KEY: ${{ secrets.PLATFORM_ADMIN_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_ARENA_PASS_PRICE_ID: ${{ secrets.STRIPE_ARENA_PASS_PRICE_ID }}
          PYYOL_LENS_ENABLED: ${{ secrets.PYYOL_LENS_ENABLED }}
          PYYOL_LENS_ENDPOINT: ${{ secrets.PYYOL_LENS_ENDPOINT }}
          PYYOL_LENS_QUERY_ENDPOINT: ${{ secrets.PYYOL_LENS_QUERY_ENDPOINT }}
          PYYOL_LENS_API_KEY: ${{ secrets.PYYOL_LENS_API_KEY }}
          PYYOL_LENS_QUERY_API_KEY: ${{ secrets.PYYOL_LENS_QUERY_API_KEY }}
          PYYOL_LENS_ORG: ${{ secrets.PYYOL_LENS_ORG }}
          # Anti-bot on onboarding — REQUIRED in prod (fail-closed). Get a real key
          # at hcaptcha.com; the frontend uses the matching sitekey.
          HCAPTCHA_SECRET: ${{ secrets.HCAPTCHA_SECRET }}
          # Privy wallet/social login (empty ⇒ email/password only)
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_VERIFICATION_KEY: ${{ secrets.PRIVY_VERIFICATION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # GitHub OAuth ("Sign in with GitHub"). GitHub forbids repo secrets whose
          # names start with GITHUB_, so these carry a GH_OAUTH_ prefix here and are
          # written to the .env below under the GITHUB_CLIENT_ID/SECRET keys the server
          # actually reads (config.go). Both empty ⇒ the route 503s, Google still works.
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          # Solana USDC deposits (all four required to enable real deposits)
          # SOLANA_CLUSTER is the network switch: "devnet" or "mainnet-beta". The
          # backend refuses to boot if it disagrees with the RPC URL or the mint, so
          # this cannot silently drift out of sync with the rest of the block below.
          SOLANA_CLUSTER: ${{ secrets.SOLANA_CLUSTER }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_USDC_MINT: ${{ secrets.SOLANA_USDC_MINT }}
          SOLANA_PLATFORM_OWNER: ${{ secrets.SOLANA_PLATFORM_OWNER }}
          SOLANA_PLATFORM_ATA: ${{ secrets.SOLANA_PLATFORM_ATA }}
          SOLANA_COMMITMENT: ${{ secrets.SOLANA_COMMITMENT }}
          # Custody topology. Leave BOTH unset for one wallet that receives deposits and
          # signs payouts — the existing devnet setup, and the default.
          #
          # SOLANA_PAYOUT_ATA splits them: deposits keep landing in SOLANA_PLATFORM_ATA,
          # whose key this server does not hold, and payouts are signed from this
          # separately funded float. The split is what makes HOT_WALLET_CAP_CENTS mean
          # anything — with one account, deposits push the signing wallet past the cap
          # through ordinary business, which teaches you to ignore the alert.
          SOLANA_PAYOUT_ATA: ${{ secrets.SOLANA_PAYOUT_ATA }}
          # Where excess float gets swept. Nothing here ever signs a sweep (a sweep key on
          # this server would recreate the exposure the cap limits) — it is configured so
          # the alert can name the destination instead of the operator looking it up
          # mid-incident. Required on mainnet when Solana withdrawals are enabled.
          SOLANA_COLD_WALLET_ADDRESS: ${{ secrets.SOLANA_COLD_WALLET_ADDRESS }}
          # Block-explorer template for the transaction link printed on every
          # receipt. Unset falls back to solscan in config.go; set it to point at a
          # different explorer, or to the devnet variant while testing.
          SOLANA_EXPLORER_TX: ${{ secrets.SOLANA_EXPLORER_TX }}
          # Solana withdrawals (encrypted hot-wallet secret + its master key)
          SOLANA_HOT_WALLET_SECRET_ENC: ${{ secrets.SOLANA_HOT_WALLET_SECRET_ENC }}
          SOLANA_HOT_WALLET_ENC_KEY: ${{ secrets.SOLANA_HOT_WALLET_ENC_KEY }}
          # Ceiling on how much we leave in the signing wallet. Unset ⇒ 0 ⇒ the alert
          # is off, which is right for devnet. Set it before mainnet.
          HOT_WALLET_CAP_CENTS: ${{ secrets.HOT_WALLET_CAP_CENTS }}
          # Native-SOL floor on the signing wallet. Every payout is a transaction and the
          # hot wallet pays its own fee, so a wallet full of USDC and empty of SOL cannot
          # pay anybody — and no USDC balance check can see it coming. Unset ⇒ 0 ⇒ off,
          # right for devnet where SOL is airdropped. Required > 0 on mainnet;
          # 50000000 (0.05 SOL) is a reasonable floor.
          HOT_WALLET_MIN_SOL_LAMPORTS: ${{ secrets.HOT_WALLET_MIN_SOL_LAMPORTS }}
          # Mints the per-turn tokens proving a gateway LLM call was made for a
          # specific decision. Unset ⇒ no proof is offered at all, so ranked
          # integrity has nothing to measure. Required before enforcement.
          # Per-decision budgets. Defaults suit real LLM agents; override only with
          # evidence from traces (agents abstaining on timeout = too tight).
          #   MOVE_WINDOW_SECONDS           Goofspiel, default 45
          #   MONOPOLY_MOVE_WINDOW_SECONDS  Monopoly,  default 60
          #   MAFIA_PHASE_WINDOW_SECONDS    0 = engine per-phase clock. LEAVE UNSET.
          MOVE_WINDOW_SECONDS: ${{ secrets.MOVE_WINDOW_SECONDS }}
          MONOPOLY_MOVE_WINDOW_SECONDS: ${{ secrets.MONOPOLY_MOVE_WINDOW_SECONDS }}
          MAFIA_PHASE_WINDOW_SECONDS: ${{ secrets.MAFIA_PHASE_WINDOW_SECONDS }}
          TURN_PROOF_SECRET: ${{ secrets.TURN_PROOF_SECRET }}
          # Share of a ranked match's decisions that must be PROVEN LLM-backed, or the
          # match is voided and both stakes returned. Unset ⇒ 0 ⇒ measurement only.
          # Do NOT set this until the proof-carrying SDK has shipped AND you have
          # looked at what honest agents actually score.
          RANKED_INTEGRITY_MIN_PCT: ${{ secrets.RANKED_INTEGRITY_MIN_PCT }}
          # Coin economy / withdrawal policy (optional tuning)
          COIN_CENTS: ${{ secrets.COIN_CENTS }}
          WITHDRAW_SELL_FEE_PCT: ${{ secrets.WITHDRAW_SELL_FEE_PCT }}
          WITHDRAW_MIN_COINS: ${{ secrets.WITHDRAW_MIN_COINS }}
          # Object storage (MinIO, runs in this compose). All optional: absent
          # secrets fall back to a derived root credential and the default bucket.
          # Guards GET /metrics. Unset in prod ⇒ the endpoint 404s, which is the
          # safe default — set it only when something needs to scrape.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MEDIA_BUCKET: ${{ secrets.MEDIA_BUCKET }}
        run: |
          set -euo pipefail
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
          : "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY secret is required}"
          : "${API_KEY_PEPPER:?API_KEY_PEPPER secret is required}"
          PORT_PUB="${ARENA_PORT:-8091}"
          BASE_URL="${BASE_URL_S:-http://${SSH_HOST}:${PORT_PUB}}"
          CORS="${CORS_S:-${BASE_URL}}"
          # Object storage credentials. compose declares these with :? so a missing
          # value aborts the whole stack at parse time — including postgres. They are
          # therefore ALWAYS written, never left to a secret being present.
          #
          # The fallback is DERIVED, not random: MinIO persists to a named volume, so
          # a fresh password on each deploy would lock us out of every object already
          # written. Deriving from JWT_SIGNING_KEY (required above) gives the same
          # strong value on every run, and setting the secret overrides it.
          # Computed here, never inside the heredoc — that heredoc is unquoted, so a
          # $( ) inside it would execute on the runner.
          MINIO_USER="${MINIO_ROOT_USER:-pyyolmedia}"
          if [ -n "${MINIO_ROOT_PASSWORD:-}" ]; then
            MINIO_PASS="$MINIO_ROOT_PASSWORD"
          else
            MINIO_PASS=$(printf '%s' "${JWT_SIGNING_KEY}:minio-root-v1" | sha256sum | cut -c1-48)
          fi
          BUCKET="${MEDIA_BUCKET:-pyyol-media}"
          umask 077
          cat > /tmp/arena.env <<EOF
          # ── Runtime (generated by deploy-backend.yml — do not edit on the server) ──
          ENV=prod
          PORT=8080
          BASE_URL=${BASE_URL}
          LOG_LEVEL=info
          DB_MAX_CONNS=50
          CORS_ALLOWED_ORIGINS=${CORS}
          AUTO_MIGRATE=true
          SANDBOX_ENABLED=true
          AGENT_VERIFY_ALLOW_PRIVATE=false
          ALLOW_MINT=false
          # :- like every other optional value here. This was the ONLY one without a
          # fallback, so it depended entirely on the env: block above still declaring
          # the key — remove that line and `set -u` aborts the whole deploy.
          HCAPTCHA_SECRET=${HCAPTCHA_SECRET:-}

          # ── Data layer (Postgres + Redis run in this compose) ──
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgres://arena:${POSTGRES_PASSWORD}@postgres:5432/arena?sslmode=disable
          REDIS_URL=redis://redis:6379/0

          # ── Object storage (MinIO in this compose; S3-compatible) ──
          # MINIO_ROOT_* are consumed by the minio + minio-init containers; the
          # S3_* pair is what the arena server itself reads. Same credential, two
          # names, because the server speaks generic S3 and could point at a managed
          # bucket later without touching compose.
          # Endpoint is the container name on the internal network — MinIO is not
          # published to the host, so this is unreachable from the internet.
          MINIO_ROOT_USER=${MINIO_USER}
          MINIO_ROOT_PASSWORD=${MINIO_PASS}
          MEDIA_BUCKET=${BUCKET}
          S3_ENDPOINT=http://minio:9000
          S3_BUCKET=${BUCKET}
          S3_ACCESS_KEY=${MINIO_USER}
          S3_SECRET_KEY=${MINIO_PASS}
          S3_REGION=us-east-1

          # ── Auth / crypto ──
          JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
          API_KEY_PEPPER=${API_KEY_PEPPER}
          AGENT_ENDPOINT_SECRET_KEY=${AGENT_ENDPOINT_SECRET_KEY:-}
          METRICS_TOKEN=${METRICS_TOKEN:-}
          # Defaults to the seeded operator id below, so a deployment that sets the two
          # SEED_ADMIN_* secrets gets a working admin login with no third setting to
          # remember. An explicit ADMIN_USER_IDS secret still wins and can list more ids.
          ADMIN_USER_IDS=${ADMIN_USER_IDS:-usr_pyyoladmin}

          # ── Operator login (seeded at boot; see internal/seedadmin) ──
          # Admin rights come from ADMIN_USER_IDS, which cannot name an account that does
          # not exist yet — so without this the first admin on a fresh deployment had to be
          # made by hand against the database. The id is deterministic, so the allowlist
          # above can name it before it exists.
          #
          # Set SEED_ADMIN_EMAIL + SEED_ADMIN_PASSWORD as repository SECRETS. Both empty
          # ⇒ nothing is seeded. Never put the password in this file: anything committed
          # here is in the history of every clone, permanently.
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
          SEED_ADMIN_USER_ID=${SEED_ADMIN_USER_ID:-}

          # SEVERAL operators, as one JSON list:
          #   [{"email":"a@x.com","password":"..."},{"email":"b@x.com","password":"..."}]
          #
          # JSON rather than a delimited string because a password contains whatever
          # character would have been the separator, and a scheme that mangles a credential
          # surfaces as "invalid login" with nothing pointing at the parser.
          #
          # The first entry takes usr_pyyoladmin (so ADMIN_USER_IDS keeps matching on a
          # deployment that already had one operator); the rest get usr_admin_<local-part>.
          # Every id must be listed in ADMIN_USER_IDS or the account signs in and sees
          # nothing — the boot log names the exact id when that happens.
          #
          # A REPOSITORY SECRET, never a literal here. This repository is public: a password
          # committed to it is disclosed the moment it is pushed, and deleting it later does
          # not help because the history keeps it.
          SEED_ADMIN_OPERATORS=${SEED_ADMIN_OPERATORS:-}
          # Short access JWT; the BFF silently rotates the refresh token so active
          # users stay signed in, and only true absence (past the refresh TTL) logs out.
          DASHBOARD_TOKEN_TTL=${DASHBOARD_TOKEN_TTL:-1h}
          REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-720h}

          # ── Platform bus (Super Admin) ──
          PLATFORM_ENGINE_PRIVATE_KEY=${PLATFORM_ENGINE_PRIVATE_KEY:-}
          PLATFORM_ADMIN_PUBLIC_KEY=${PLATFORM_ADMIN_PUBLIC_KEY:-}

          # ── Payments (empty STRIPE_SECRET_KEY ⇒ offline dev gateway) ──
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
          STRIPE_ARENA_PASS_PRICE_ID=${STRIPE_ARENA_PASS_PRICE_ID:-}
          CHECKOUT_SUCCESS_URL=${BASE_URL}/billing/success
          CHECKOUT_CANCEL_URL=${BASE_URL}/billing/cancel

          # ── Pyyol Lens telemetry (optional) ──
          # NOTE: no backticks or \$( ) anywhere in this heredoc — it is unquoted
          # (<<EOF), so shell substitution runs on the runner. A backtick pair here
          # executed 'pyyol' on every deploy and silently blanked the rest of this
          # comment; anything more dangerous would have run just as happily.
          # Endpoint defaults to the Lens ingest container on the shared 'pyyol'
          # network; ORG must equal the admin's LENS_ORG_ID + the query-api org.
          PYYOL_LENS_ENABLED=${PYYOL_LENS_ENABLED:-false}
          PYYOL_LENS_ENDPOINT=${PYYOL_LENS_ENDPOINT:-http://pyyol-lens-ingest:8081}
          # Read path for the developer trace view (a DIFFERENT service and port from
          # ingest above). Unset ⇒ /v1/developer/traces returns 503; nothing else is
          # affected, since trace read-back must never be able to block play.
          PYYOL_LENS_QUERY_ENDPOINT=${PYYOL_LENS_QUERY_ENDPOINT:-http://pyyol-lens-query:8082}
          PYYOL_LENS_API_KEY=${PYYOL_LENS_API_KEY:-}
          # The Lens gates ingest and query on SEPARATE secrets: this must equal the
          # tracing stack's QUERY_API_KEY (the same value as the admin's LENS_API_KEY),
          # NOT its INGEST_API_KEY. Unset falls back to PYYOL_LENS_API_KEY, which is
          # correct only for a single-key stack — on a two-key stack the read 401s and
          # the developer trace view can only report itself as unavailable.
          PYYOL_LENS_QUERY_API_KEY=${PYYOL_LENS_QUERY_API_KEY:-}
          PYYOL_LENS_ORG=${PYYOL_LENS_ORG:-pyyol}
          PYYOL_LENS_PROJECT=arena

          # ── Privy login (empty ⇒ Privy disabled, email/password still works) ──
          PRIVY_APP_ID=${PRIVY_APP_ID:-}
          PRIVY_VERIFICATION_KEY=${PRIVY_VERIFICATION_KEY:-}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
          # GitHub OAuth login. Sourced from the GH_OAUTH_* secrets above (the
          # GITHUB_ secret prefix is reserved). Both empty ⇒ GitHub login disabled.
          GITHUB_CLIENT_ID=${GH_OAUTH_CLIENT_ID:-}
          GITHUB_CLIENT_SECRET=${GH_OAUTH_CLIENT_SECRET:-}

          # ── Solana USDC deposits (need RPC + mint + owner + ATA to enable) ──
          SOLANA_CLUSTER=${SOLANA_CLUSTER:-}
          SOLANA_RPC_URL=${SOLANA_RPC_URL:-}
          SOLANA_USDC_MINT=${SOLANA_USDC_MINT:-}
          SOLANA_PLATFORM_OWNER=${SOLANA_PLATFORM_OWNER:-}
          SOLANA_PLATFORM_ATA=${SOLANA_PLATFORM_ATA:-}
          SOLANA_COMMITMENT=${SOLANA_COMMITMENT:-finalized}
          SOLANA_EXPLORER_TX=${SOLANA_EXPLORER_TX:-}
          # Both empty ⇒ single-wallet custody (unchanged behaviour).
          SOLANA_PAYOUT_ATA=${SOLANA_PAYOUT_ATA:-}
          SOLANA_COLD_WALLET_ADDRESS=${SOLANA_COLD_WALLET_ADDRESS:-}
          HOT_WALLET_CAP_CENTS=${HOT_WALLET_CAP_CENTS:-0}
          HOT_WALLET_MIN_SOL_LAMPORTS=${HOT_WALLET_MIN_SOL_LAMPORTS:-0}
          MOVE_WINDOW_SECONDS=${MOVE_WINDOW_SECONDS:-45}
          MONOPOLY_MOVE_WINDOW_SECONDS=${MONOPOLY_MOVE_WINDOW_SECONDS:-60}
          MAFIA_PHASE_WINDOW_SECONDS=${MAFIA_PHASE_WINDOW_SECONDS:-0}
          TURN_PROOF_SECRET=${TURN_PROOF_SECRET:-}
          RANKED_INTEGRITY_MIN_PCT=${RANKED_INTEGRITY_MIN_PCT:-0}

          # ── Solana withdrawals (encrypted hot-wallet secret; deposits must be on) ──
          SOLANA_HOT_WALLET_SECRET_ENC=${SOLANA_HOT_WALLET_SECRET_ENC:-}
          SOLANA_HOT_WALLET_ENC_KEY=${SOLANA_HOT_WALLET_ENC_KEY:-}

          # ── Coin economy / withdrawal policy (optional; sensible engine defaults) ──
          COIN_CENTS=${COIN_CENTS:-1}
          WITHDRAW_SELL_FEE_PCT=${WITHDRAW_SELL_FEE_PCT:-}
          WITHDRAW_MIN_COINS=${WITHDRAW_MIN_COINS:-}

          # ── Compose interpolation ──
          ARENA_IMAGE=${IMAGE_REF}
          ARENA_PORT=${PORT_PUB}
          EOF
          echo "Generated /tmp/arena.env ($(wc -l < /tmp/arena.env) lines)"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship compose file + .env to the server (image comes from the registry)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          # Retry the transport, not the deploy. "ssh: connect to host ... Connection
          # timed out" has failed real deploys here twice with the box perfectly
          # healthy (the API kept serving 200s throughout) — a runner IP tripping
          # fail2ban, or a blip between GitHub and the VPS. Each attempt is a fresh
          # TCP connect, and ConnectTimeout keeps a black-holed port from burning
          # two minutes per try instead of failing fast and retrying.
          #
          # Only connection setup is retried. Every command below is idempotent
          # (mkdir -p, overwriting scp), so a retry after a partial transfer just
          # rewrites the file.
          retry_ssh() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 4 ]; then
                echo "::error::ssh/scp failed after $n attempts — check the VPS is reachable on port $PORT (sshd up? firewall? fail2ban ban on the runner IP?)"
                return 1
              fi
              echo "attempt $n failed; retrying in $((n * 15))s..."
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15"

          retry_ssh ssh -i ~/.ssh/id_deploy -p "$PORT" $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          retry_ssh scp -i ~/.ssh/id_deploy -P "$PORT" $SSH_OPTS \
            backend/deploy/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.prod.yml"
          retry_ssh scp -i ~/.ssh/id_deploy -P "$PORT" $SSH_OPTS \
            /tmp/arena.env "$SSH_USER@$SSH_HOST:$REMOTE_DIR/.env"

      - name: Deploy (pull image from registry + compose up + migrate-on-boot)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # Docker Hub creds are passed into the remote shell env (masked in CI logs)
          # so the server can pull the private image, then it logs out immediately.
          # No retry wrapper here on purpose: this step runs the actual deploy, and a
          # blanket retry would re-run a genuinely failed deploy up to four times.
          # ConnectTimeout only makes an unreachable host fail fast instead of
          # hanging for two minutes; ServerAliveInterval keeps a long compose pull
          # from being dropped as idle.
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' DHUSER='$DOCKERHUB_USERNAME' DHTOKEN='$DOCKERHUB_TOKEN' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$REMOTE_DIR"

          # Docker present? (no-op if already installed)
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker..."; curl -fsSL https://get.docker.com | sh
          fi
          DC="docker compose"; docker compose version >/dev/null 2>&1 || DC="docker-compose"

          # Read the published port from the generated .env.
          ARENA_PORT="$(grep -E '^ARENA_PORT=' .env | cut -d= -f2)"; ARENA_PORT="${ARENA_PORT:-8091}"

          # Shared cross-repo network (admin + tracing attach to it too). Idempotent.
          docker network create pyyol 2>/dev/null || true

          echo "Pulling the server image from the private registry..."
          echo "$DHTOKEN" | docker login -u "$DHUSER" --password-stdin
          $DC -f docker-compose.prod.yml --env-file .env pull server
          docker logout >/dev/null 2>&1 || true   # don't leave the token on disk

          echo "Starting stack fresh (DB keeps its named volume; app is recreated)..."
          # Postgres is NEVER force-recreated — its named volume (pgdata) holds all
          # data, so it survives every deploy. The app + cache are force-recreated so
          # each deploy starts from a clean container (server re-runs AUTO_MIGRATE).
          $DC -f docker-compose.prod.yml --env-file .env up -d postgres
          $DC -f docker-compose.prod.yml --env-file .env up -d --force-recreate --no-deps server redis
          $DC -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          docker image prune -f >/dev/null 2>&1 || true

          # Open the port on the host firewall (best-effort; also open it in the
          # Hostinger panel firewall if one sits in front of the VPS).
          if command -v ufw >/dev/null 2>&1; then ufw allow "${ARENA_PORT}"/tcp || true; fi

          echo "Waiting for /readyz (DB reachable + migrations applied)..."
          READY=no
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:${ARENA_PORT}/readyz" >/dev/null 2>&1; then
              echo "✅ Arena backend healthy on :${ARENA_PORT} (/readyz OK — migrations applied)."
              READY=yes; break
            fi
            [ "$i" -eq 40 ] && { echo "❌ /readyz never became healthy."; $DC -f docker-compose.prod.yml logs --tail=80 server; exit 1; }
            sleep 3
          done
          [ "$READY" = yes ] || exit 1

          # Surface the operator seeding result.
          #
          # Seeding runs on every boot and, until now, said so only in the container log —
          # which this workflow prints ONLY when the deploy fails. So the one outcome that
          # decides whether anyone can sign in as an admin was invisible on every successful
          # deploy, and the failure mode is silent by nature: an operator whose id is not in
          # ADMIN_USER_IDS signs in perfectly well and sees an empty console.
          #
          # The server already logs that case as a WARN naming the exact id to add. This just
          # puts those lines where whoever ran the deploy will actually see them.
          #
          # Grepped rather than dumped because the full log is noisy, and NOTHING here prints
          # a credential: the server logs the public id, whether the account was created and
          # whether it is in the allowlist — never the password.
          echo "--- operator seeding ---"
          SEEDLOG=$($DC -f docker-compose.prod.yml logs --tail=400 server 2>/dev/null \
            | grep -E "operator account|SEED_ADMIN_OPERATORS|admin allowlist" || true)
          if [ -n "$SEEDLOG" ]; then
            echo "$SEEDLOG"
          else
            echo "(no seeding lines — SEED_ADMIN_OPERATORS and SEED_ADMIN_EMAIL are both unset)"
          fi
          # A seeded account missing from the allowlist is not a deploy failure — the arena is
          # serving and every other user is fine — so this warns loudly rather than exiting 1.
          if printf '%s' "$SEEDLOG" | grep -q "NOT in ADMIN_USER_IDS"; then
            echo "::warning::An operator account is not in ADMIN_USER_IDS: it can sign in but has no admin rights. See the line above for the id to add."
          fi
          ENDSSH

      - name: Summary
        if: success()
        run: echo "🚀 Deployed ${GITHUB_SHA::12} to ${{ secrets.SSH_HOST }}. Health = http://${{ secrets.SSH_HOST }}:${{ secrets.ARENA_PORT || '8091' }}/readyz"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_deploy /tmp/arena.env
