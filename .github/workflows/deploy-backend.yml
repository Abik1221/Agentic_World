name: deploy-backend

# CI + CD for the Agent Arena backend → Hostinger VPS.
#
# Flow on every push to main (or manual dispatch):
#   1. test  — go build + vet + race tests. Deploy is gated on this (fail = no deploy).
#   2. deploy — build the distroless server image, ship it over SSH, generate the
#      prod .env from GitHub Secrets, `docker compose up -d`. The server applies DB
#      migrations in-process on boot (AUTO_MIGRATE=true), then we poll /readyz until
#      it reports the DB + Redis are healthy (i.e. migrations succeeded).
#
# Required GitHub Secrets — see the list printed at the bottom of this file's PR /
# the deploy summary. SSH: DEPLOY_SSH_KEY, SSH_HOST, SSH_USER, SSH_PORT.
# App secrets: POSTGRES_PASSWORD, JWT_SIGNING_KEY, API_KEY_PEPPER, … (full list below).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

env:
  IMAGE: "agent-arena-server:latest"
  REMOTE_DIR: "/opt/agent-arena"

jobs:
  # ── CI gate: must pass before anything is deployed ──────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...

  # ── CD: build → ship → migrate-on-boot → healthcheck ────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f backend/Dockerfile -t "$IMAGE" --build-arg VERSION="${GITHUB_SHA::12}" backend

      - name: Save image to a tarball
        run: docker save "$IMAGE" | gzip > /tmp/arena-server.tar.gz

      - name: Generate prod .env from secrets
        env:
          ARENA_PORT: ${{ secrets.ARENA_PORT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          BASE_URL_S: ${{ secrets.BASE_URL }}
          CORS_S: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          AGENT_ENDPOINT_SECRET_KEY: ${{ secrets.AGENT_ENDPOINT_SECRET_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          PLATFORM_ENGINE_PRIVATE_KEY: ${{ secrets.PLATFORM_ENGINE_PRIVATE_KEY }}
          PLATFORM_ADMIN_PUBLIC_KEY: ${{ secrets.PLATFORM_ADMIN_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_ARENA_PASS_PRICE_ID: ${{ secrets.STRIPE_ARENA_PASS_PRICE_ID }}
          PYYOL_LENS_ENABLED: ${{ secrets.PYYOL_LENS_ENABLED }}
          PYYOL_LENS_ENDPOINT: ${{ secrets.PYYOL_LENS_ENDPOINT }}
          PYYOL_LENS_API_KEY: ${{ secrets.PYYOL_LENS_API_KEY }}
          PYYOL_LENS_ORG: ${{ secrets.PYYOL_LENS_ORG }}
        run: |
          set -euo pipefail
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
          : "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY secret is required}"
          : "${API_KEY_PEPPER:?API_KEY_PEPPER secret is required}"
          PORT_PUB="${ARENA_PORT:-8091}"
          BASE_URL="${BASE_URL_S:-http://${SSH_HOST}:${PORT_PUB}}"
          CORS="${CORS_S:-${BASE_URL}}"
          umask 077
          cat > /tmp/arena.env <<EOF
          # ── Runtime (generated by deploy-backend.yml — do not edit on the server) ──
          ENV=prod
          PORT=8080
          BASE_URL=${BASE_URL}
          LOG_LEVEL=info
          DB_MAX_CONNS=50
          CORS_ALLOWED_ORIGINS=${CORS}
          AUTO_MIGRATE=true
          SANDBOX_ENABLED=true
          AGENT_VERIFY_ALLOW_PRIVATE=false
          ALLOW_MINT=false

          # ── Data layer (Postgres + Redis run in this compose) ──
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgres://arena:${POSTGRES_PASSWORD}@postgres:5432/arena?sslmode=disable
          REDIS_URL=redis://redis:6379/0

          # ── Auth / crypto ──
          JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
          API_KEY_PEPPER=${API_KEY_PEPPER}
          AGENT_ENDPOINT_SECRET_KEY=${AGENT_ENDPOINT_SECRET_KEY:-}
          ADMIN_USER_IDS=${ADMIN_USER_IDS:-}

          # ── Platform bus (Super Admin) ──
          PLATFORM_ENGINE_PRIVATE_KEY=${PLATFORM_ENGINE_PRIVATE_KEY:-}
          PLATFORM_ADMIN_PUBLIC_KEY=${PLATFORM_ADMIN_PUBLIC_KEY:-}

          # ── Payments (empty STRIPE_SECRET_KEY ⇒ offline dev gateway) ──
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
          STRIPE_ARENA_PASS_PRICE_ID=${STRIPE_ARENA_PASS_PRICE_ID:-}
          CHECKOUT_SUCCESS_URL=${BASE_URL}/billing/success
          CHECKOUT_CANCEL_URL=${BASE_URL}/billing/cancel

          # ── Pyyol Lens telemetry (optional) ──
          # Endpoint defaults to the Lens ingest container on the shared `pyyol`
          # network; ORG must equal the admin's LENS_ORG_ID + the query-api org.
          PYYOL_LENS_ENABLED=${PYYOL_LENS_ENABLED:-false}
          PYYOL_LENS_ENDPOINT=${PYYOL_LENS_ENDPOINT:-http://pyyol-lens-ingest:8081}
          PYYOL_LENS_API_KEY=${PYYOL_LENS_API_KEY:-}
          PYYOL_LENS_ORG=${PYYOL_LENS_ORG:-pyyol}
          PYYOL_LENS_PROJECT=arena

          # ── Compose interpolation ──
          ARENA_IMAGE=${IMAGE}
          ARENA_PORT=${PORT_PUB}
          EOF
          echo "Generated /tmp/arena.env ($(wc -l < /tmp/arena.env) lines)"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship image, compose file, and .env to the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=no \
            /tmp/arena-server.tar.gz "$SSH_USER@$SSH_HOST:$REMOTE_DIR/arena-server.tar.gz"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=no \
            backend/deploy/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.prod.yml"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=no \
            /tmp/arena.env "$SSH_USER@$SSH_HOST:$REMOTE_DIR/.env"

      - name: Deploy (load image + compose up + migrate-on-boot)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$REMOTE_DIR"

          # Docker present? (no-op if already installed)
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker..."; curl -fsSL https://get.docker.com | sh
          fi
          DC="docker compose"; docker compose version >/dev/null 2>&1 || DC="docker-compose"

          echo "Loading server image..."
          docker load < arena-server.tar.gz
          rm -f arena-server.tar.gz

          # Read the published port from the generated .env.
          ARENA_PORT="$(grep -E '^ARENA_PORT=' .env | cut -d= -f2)"; ARENA_PORT="${ARENA_PORT:-8091}"

          # Shared cross-repo network (admin + tracing attach to it too). Idempotent.
          docker network create pyyol 2>/dev/null || true

          echo "Starting stack (server auto-migrates on boot)..."
          $DC -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          docker image prune -f >/dev/null 2>&1 || true

          # Open the port on the host firewall (best-effort; also open it in the
          # Hostinger panel firewall if one sits in front of the VPS).
          if command -v ufw >/dev/null 2>&1; then ufw allow "${ARENA_PORT}"/tcp || true; fi

          echo "Waiting for /readyz (DB reachable + migrations applied)..."
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:${ARENA_PORT}/readyz" >/dev/null 2>&1; then
              echo "✅ Arena backend healthy on :${ARENA_PORT} (/readyz OK — migrations applied)."; exit 0
            fi
            [ "$i" -eq 40 ] && { echo "❌ /readyz never became healthy."; $DC -f docker-compose.prod.yml logs --tail=80 server; exit 1; }
            sleep 3
          done
          ENDSSH

      - name: Summary
        if: success()
        run: echo "🚀 Deployed ${GITHUB_SHA::12} to ${{ secrets.SSH_HOST }}. Health = http://${{ secrets.SSH_HOST }}:${{ secrets.ARENA_PORT || '8091' }}/readyz"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_deploy /tmp/arena.env
