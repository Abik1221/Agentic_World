name: pr-title

# Enforces Conventional Commit PR titles. With squash-merge, the PR title becomes
# the commit on main — and release-please derives every SDK version bump from those
# commit messages. A non-conventional title (e.g. "updates") would merge without
# ever bumping/publishing the SDK, so we gate it here. Scopes are free-form
# (feat(sdk):, fix(cli):, …); a `!` or BREAKING CHANGE triggers a major bump.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
