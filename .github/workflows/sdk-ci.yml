name: sdk-ci

# Tests both SDKs on every change under sdk/. Path-filtered so backend-only PRs
# don't trigger it. Release publishing lives in release-python.yml / release-js.yml.
on:
  push:
    branches: [main]
    paths: ["sdk/**", ".github/workflows/sdk-ci.yml"]
  pull_request:
    paths: ["sdk/**", ".github/workflows/sdk-ci.yml"]

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match pyproject's requires-python. 3.9 stayed here after the floor was
        # raised to 3.10 (it is EOL), so the job installed nothing and failed with
        # "Package 'pyyol' requires a different Python" on every run — a red check that
        # said nothing about the code.
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff so lint/format is deterministic — an unpinned `pipx run ruff`
      # silently tracks the latest release and its formatter can drift between runs.
      - run: pipx run --spec 'ruff==0.15.5' ruff check .
      - run: pipx run --spec 'ruff==0.15.5' ruff format --check .

  python-typecheck:
    # We ship py.typed (a PEP 561 typing guarantee); verify it with mypy so the
    # guarantee is real, not aspirational.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" mypy
      - run: mypy pyyol

  python-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*

  js-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "${{ matrix.node }}"
      - run: npm ci
      - run: npm test

  llms-docs-fresh:
    # Regenerate the game reference from the engine + the llms corpus, and fail if
    # anything drifts. games.md/gamespec.json are generated from the live engine
    # constants (backend/internal/gamespec) so the docs can never disagree with the
    # rules the engine actually enforces; llms.txt/llms-full.txt are then rebuilt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gamespec drift test (docs vocabulary == engine vocabulary)
        run: go test ./internal/gamespec/...
        working-directory: backend
      - name: regenerate game reference from the engine
        run: go run ./cmd/gamespec
        working-directory: backend
      - name: regenerate llms corpus
        run: python sdk/docs/gen_llms.py
      - name: docs are up to date (run `go run ./cmd/gamespec` + `python sdk/docs/gen_llms.py` and commit)
        # Includes the copies bundled into each SDK package (pyyol/rules, js/rules)
        # so the shipped game rules can never drift from the engine-generated source.
        run: git diff --exit-code -- sdk/docs/games.md sdk/docs/gamespec.json sdk/docs/llms.txt sdk/docs/llms-full.txt sdk/python/pyyol/rules sdk/js/rules

  js-lint-and-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
      - name: SDK_VERSION matches package.json (no drift)
        run: |
          node -e "import('./dist/version.js').then(m=>{const v=require('./package.json').version;if(m.SDK_VERSION!==v){console.error('drift: '+m.SDK_VERSION+' != '+v);process.exit(1)}})"
      - name: npm pack excludes tests, includes LICENSE
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "const f=require('/tmp/pack.json')[0].files.map(x=>x.path); const t=f.filter(p=>/test/.test(p)); if(t.length){console.error('test files leaked:',t);process.exit(1)} if(!f.includes('LICENSE')){console.error('LICENSE missing from tarball');process.exit(1)}"
