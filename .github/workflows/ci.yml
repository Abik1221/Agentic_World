name: ci

on:
  pull_request: # validation runs on PRs; push-to-main is handled by the deploy workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: backend/go.sum

      # Build both SDKs so the cross-language e2e tests (agentgw crosslang_test)
      # actually RUN instead of skipping — they drive the REAL Python + JS SDK
      # connectors against the Go gateway over WSS.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build JS SDK (for the cross-lang e2e)
        working-directory: sdk/js
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK (for the cross-lang e2e)
        working-directory: sdk/python
        run: python -m pip install -e .

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache: true, cache-dependency-path: backend/go.sum }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with: { version: latest, working-directory: backend }

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache: true, cache-dependency-path: backend/go.sum }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
