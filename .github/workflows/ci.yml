name: ci

on:
  pull_request:
  # ALSO on main. The deploy workflow carries its own build+vet+race gate, so a broken
  # commit cannot reach production either way — but golangci-lint lives HERE and nowhere
  # else, so with PR-only triggers a lint regression merged straight to main was never
  # reported by anything. A push that skips a check is a check that decays.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: backend/go.sum

      # Build both SDKs so the cross-language e2e tests (agentgw crosslang_test)
      # actually RUN instead of skipping — they drive the REAL Python + JS SDK
      # connectors against the Go gateway over WSS.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build JS SDK (for the cross-lang e2e)
        working-directory: sdk/js
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK (for the cross-lang e2e)
        working-directory: sdk/python
        run: python -m pip install -e .

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  # ── DB round-trip: the real schema, parsing the real SQL ───────────────────
  #
  # MatchUsageRepo.OwnedBy referenced a column that has never existed and 500'd for its
  # entire life, undetected, because a fake repo cannot parse SQL and nothing called the
  # endpoint. This job is the round trip: apply every migration to a real Postgres, then
  # run the queries the way production runs them.
  #
  # Its own job, and NOT a dependency of the deploy gate, deliberately: a database that
  # will not start must not be able to block shipping a frontend change. A red result here
  # is information — it means a query is wrong — and it is reported without holding
  # everything else hostage.
  dbtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pyyol
          POSTGRES_USER: pyyol
          POSTGRES_DB: pyyol_test
        ports: ["5432:5432"]
        # Without a healthcheck the test starts before Postgres accepts connections and
        # fails on a race rather than on anything real.
        options: >-
          --health-cmd "pg_isready -U pyyol -d pyyol_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pyyol:pyyol@localhost:5432/pyyol_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.13', cache: true, cache-dependency-path: backend/go.sum }
      # Migrations are applied by the suite's own TestMain, through the same in-process
      # runner the server uses on boot — so the schema under test is the schema production
      # gets, and there is no second place for it to drift.
      - name: Round-trip tests
        run: go test -tags=dbtest -count=1 ./internal/store/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.13', cache: true, cache-dependency-path: backend/go.sum }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        # Pinned, for the same reason the Go toolchain above is pinned: `latest` lets a
        # new linter release enable new checks and fail a build with no commit to
        # blame, usually at the worst moment. Bump this deliberately.
        with: { version: v2.12.2, working-directory: backend }

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.13', cache: true, cache-dependency-path: backend/go.sum }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Pyyol Lens, on its own Go 1.26 toolchain.
  #
  # Added because this module was tested only at DEPLOY time. deploy-tracing runs `go test`
  # before shipping, so a change that broke Lens compiled fine in `ci`, passed review, merged,
  # and failed at the deploy — which is the most expensive place to find it and the one with
  # a half-updated stack on the other side. Phase 6 put the harness discriminator in here, so
  # the module now carries logic the boards depend on.
  #
  # Separate job rather than a step on `backend`: this is a DIFFERENT MODULE on a different Go
  # minor (go.mod requires 1.26.1, the arena is on 1.25), and sharing a setup-go step would
  # silently build one of them with the wrong toolchain.
  lens:
    name: lens (tracing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracing/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true, cache-dependency-path: tracing/backend/go.sum }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
