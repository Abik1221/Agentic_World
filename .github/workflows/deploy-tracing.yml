name: deploy-tracing

# CI + CD for the Pyyol Lens observability stack (tracing/) → VPS.
# Served on the trace subdomain. nginx is installed by this workflow
# (deploy/install-trace-vhost.sh → 127.0.0.1:3100; named vhost only — Mega Hub
# stays default_server / its own hostname). Same pattern as admin.pyyol.com:
# Cloudflare orange-cloud to origin :443, Host/SNI selects the vhost.
# See tracing/deploy/nginx/trace.pyyol.com.conf.
#
# Same ship pattern as Super_Admin/deploy.yml + arena deploy-backend.yml:
#   1. test   — Go build/vet/test as a CI gate.
#   2. build  — backend + web images in GitHub Actions, push to the private
#      Docker Hub repo (DOCKERHUB_REPO:lens-backend-<sha> / lens-web-<sha>).
#   3. ship   — compose files + generated .env + nginx installer over SSH.
#   4. deploy — server logs in, `compose pull`s the pinned tags, `up -d` (NO
#      --build). Building Next.js + four Go binaries on the VPS is why this
#      workflow used to hang/fail while Super Admin succeeded: admin never
#      compiles on the host.
#
# Stack (tracing/docker-compose.yml + deploy/docker-compose.prod.yml overlay):
#   clickhouse, postgres, nats, minio  — internal data plane (never public)
#   ingest-api (8081), processor, query-api (8082), control-api (8083) — backend
#   web (3100 loopback + 3110 public-if-firewall-allows) — dashboard; Mega Hub keeps its own :80/:443 vhost
# Processor applies ClickHouse migrations in-process on boot (embedded, idempotent).
#
# ── Required GitHub Secrets (this repo) ────────────────────────────────────────
#   SSH:  DEPLOY_SSH_KEY, SSH_HOST, SSH_USER (default root), SSH_PORT (default 22)
#   Registry (same as arena): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_REPO
#   App:  QUERY_API_KEY            gate for the query-api (MUST equal admin LENS_API_KEY)
#         INGEST_API_KEY           gate for ingest (MUST equal the arena PYYOL_LENS_API_KEY)
#         PYYOL_LENS_AUTH_PASSWORD dashboard login password
#         PYYOL_LENS_SESSION_SECRET dashboard session-signing secret
#         PYYOL_LENS_AUTH_USER     dashboard login user            [optional, default admin]
#         PYYOL_LENS_DEFAULT_ORG_ID org scope                       [optional, default pyyol]

on:
  push:
    branches: [main]
    paths:
      - "tracing/**"
      - ".github/workflows/deploy-tracing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tracing
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_DIR: "/opt/pyyol-lens"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracing/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: tracing/backend/go.mod
          cache: true
          cache-dependency-path: tracing/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Build + push Lens images to Docker Hub (private)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_REPO:?DOCKERHUB_REPO secret is required}"
          SHA="${GITHUB_SHA::12}"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -f tracing/backend/Dockerfile \
            -t "$DOCKERHUB_REPO:lens-backend-$SHA" -t "$DOCKERHUB_REPO:lens-backend-latest" \
            tracing/backend
          docker build -f tracing/web/Dockerfile \
            -t "$DOCKERHUB_REPO:lens-web-$SHA" -t "$DOCKERHUB_REPO:lens-web-latest" \
            tracing/web
          docker push "$DOCKERHUB_REPO:lens-backend-$SHA"
          docker push "$DOCKERHUB_REPO:lens-backend-latest"
          docker push "$DOCKERHUB_REPO:lens-web-$SHA"
          docker push "$DOCKERHUB_REPO:lens-web-latest"
          docker logout
          echo "LENS_BACKEND_IMAGE=$DOCKERHUB_REPO:lens-backend-$SHA" >> "$GITHUB_ENV"
          echo "LENS_WEB_IMAGE=$DOCKERHUB_REPO:lens-web-$SHA" >> "$GITHUB_ENV"

      - name: Generate prod .env from secrets
        env:
          QUERY_API_KEY: ${{ secrets.QUERY_API_KEY }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          PYYOL_LENS_AUTH_USER: ${{ secrets.PYYOL_LENS_AUTH_USER }}
          PYYOL_LENS_AUTH_PASSWORD: ${{ secrets.PYYOL_LENS_AUTH_PASSWORD }}
          PYYOL_LENS_SESSION_SECRET: ${{ secrets.PYYOL_LENS_SESSION_SECRET }}
          PYYOL_LENS_DEFAULT_ORG_ID: ${{ secrets.PYYOL_LENS_DEFAULT_ORG_ID }}
        run: |
          set -euo pipefail
          : "${QUERY_API_KEY:?QUERY_API_KEY secret is required}"
          : "${INGEST_API_KEY:?INGEST_API_KEY secret is required}"
          : "${PYYOL_LENS_AUTH_PASSWORD:?PYYOL_LENS_AUTH_PASSWORD secret is required}"
          : "${PYYOL_LENS_SESSION_SECRET:?PYYOL_LENS_SESSION_SECRET secret is required}"
          umask 077
          cat > tracing/deploy/.env <<EOF
          PYYOL_LENS_ENV=production
          QUERY_API_KEY=${QUERY_API_KEY}
          INGEST_API_KEY=${INGEST_API_KEY}
          PYYOL_LENS_AUTH_USER=${PYYOL_LENS_AUTH_USER:-admin}
          PYYOL_LENS_AUTH_PASSWORD=${PYYOL_LENS_AUTH_PASSWORD}
          PYYOL_LENS_SESSION_SECRET=${PYYOL_LENS_SESSION_SECRET}
          PYYOL_LENS_DEFAULT_ORG_ID=${PYYOL_LENS_DEFAULT_ORG_ID:-pyyol}
          TRACE_PUBLIC_PORT=3110
          LENS_BACKEND_IMAGE=${LENS_BACKEND_IMAGE}
          LENS_WEB_IMAGE=${LENS_WEB_IMAGE}
          EOF
          echo "Generated tracing/deploy/.env ($(wc -l < tracing/deploy/.env) lines)"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship compose + .env + vhost installer to the server (images come from the registry)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; USER="${SSH_USER:-root}"
          # Compose bind-mounts clickhouse-config + SQL init scripts; nginx installer
          # lives under deploy/. App source stays off the VPS — images were pushed above.
          tar czf /tmp/tracing-deploy.tar.gz -C tracing \
            docker-compose.yml deploy clickhouse-config backend/migrations
          retry_ssh() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 4 ]; then
                echo "::error::ssh/scp failed after $n attempts — check the VPS is reachable on port $PORT (sshd up? firewall? fail2ban ban on the runner IP?)"
                return 1
              fi
              echo "attempt $n failed; retrying in $((n * 15))s..."
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15"
          retry_ssh ssh -i ~/.ssh/id_deploy -p "$PORT" $SSH_OPTS "$USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          retry_ssh scp -i ~/.ssh/id_deploy -P "$PORT" $SSH_OPTS \
            /tmp/tracing-deploy.tar.gz "$USER@$SSH_HOST:$REMOTE_DIR/tracing-deploy.tar.gz"

      - name: Deploy (pull images + up + migrate-on-boot + health)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; USER="${SSH_USER:-root}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$USER@$SSH_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' DHUSER='$DOCKERHUB_USERNAME' DHTOKEN='$DOCKERHUB_TOKEN' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$REMOTE_DIR"
          if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sh; fi
          DC="docker compose"; docker compose version >/dev/null 2>&1 || DC="docker-compose"

          tar xzf tracing-deploy.tar.gz && rm -f tracing-deploy.tar.gz

          # Shared cross-repo network (arena + admin attach to it). Idempotent.
          docker network create pyyol 2>/dev/null || true

          COMPOSE="$DC -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env"

          echo "Pulling Lens images from the private registry (no build on the server)..."
          echo "$DHTOKEN" | docker login -u "$DHUSER" --password-stdin
          $COMPOSE pull ingest-api query-api control-api processor web
          # Logout before `up` (do not leave the Hub token on disk). `up` must use
          # the images just pulled — not re-pull. pull_policy: always after logout
          # failed with: pull access denied for the private repo.
          docker logout >/dev/null 2>&1 || true

          echo "Starting stack (volumes persist; app containers recreated from pulled tags)..."
          dump_logs() {
            $COMPOSE ps || true
            for svc in clickhouse postgres nats minio control-api query-api ingest-api processor web; do
              echo "───────── $svc ─────────"
              $COMPOSE logs --tail=80 "$svc" 2>&1 || true
            done
          }
          # --no-deps on the app recreate matches Super Admin: do not stall `up` on
          # compose healthchecks (the historical "pyyol-lens-control is unhealthy"
          # abort). Infra first, then apps, then a final up for anything missing.
          # --pull never on app `up`: overlay also sets pull_policy: missing; both
          # stop `up` from hitting the private registry after logout. Infra images
          # are public and may still need a first-time pull.
          $COMPOSE up -d clickhouse postgres nats minio
          $COMPOSE up -d --pull never --force-recreate --no-deps ingest-api processor query-api control-api web
          if ! $COMPOSE up -d --pull never --remove-orphans; then
            echo "❌ compose up failed. State and logs follow:"
            dump_logs
            exit 1
          fi
          docker image prune -f >/dev/null 2>&1 || true

          echo "Waiting for ClickHouse to be healthy..."
          for i in $(seq 1 40); do
            if docker exec pyyol-lens-clickhouse clickhouse-client -q "SELECT 1" >/dev/null 2>&1; then
              echo "✅ ClickHouse healthy."; break; fi
            [ "$i" -eq 40 ] && { echo "❌ ClickHouse never healthy."; dump_logs; exit 1; }
            sleep 3
          done

          echo "Waiting for the processor to apply ClickHouse migrations..."
          for i in $(seq 1 30); do
            if docker exec pyyol-lens-clickhouse clickhouse-client --database pyyol_lens \
                 -q "SELECT count() FROM schema_migrations" 2>/dev/null | grep -qE '[1-9]'; then
              echo "✅ Migrations applied ($(docker exec pyyol-lens-clickhouse clickhouse-client --database pyyol_lens -q 'SELECT count() FROM schema_migrations') tracked)."; break; fi
            [ "$i" -eq 30 ] && { echo "❌ Migrations never applied."; dump_logs; exit 1; }
            sleep 2
          done

          echo "Waiting for ingest + query APIs..."
          for svc in "ingest:8081" "query:8082"; do
            name="${svc%%:*}"; p="${svc##*:}"
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${p}/health" >/dev/null 2>&1; then echo "✅ ${name}-api healthy on :${p}."; break; fi
              [ "$i" -eq 30 ] && { echo "❌ ${name}-api never healthy."; dump_logs; exit 1; }
              sleep 2
            done
          done

          echo "Waiting for Pyyol Eye on 127.0.0.1:3100 and public :3110…"
          for p in 3100 3110; do
            for i in $(seq 1 40); do
              if curl -fsS -m 3 "http://127.0.0.1:${p}/" >/dev/null 2>&1; then
                echo "✅ web dashboard healthy on :${p}."; break; fi
              [ "$i" -eq 40 ] && { echo "❌ web dashboard never healthy on :${p}."; dump_logs; exit 1; }
              sleep 3
            done
          done

          echo "Opening dedicated Eye port 3110 (Mega Hub keeps :80/:443)…"
          if command -v ufw >/dev/null 2>&1; then ufw allow 3110/tcp || true; fi
          if command -v iptables >/dev/null 2>&1; then
            iptables -C INPUT -p tcp --dport 3110 -j ACCEPT 2>/dev/null \
              || iptables -I INPUT -p tcp --dport 3110 -j ACCEPT || true
          fi

          echo "Installing nginx vhost on the shared origin edge (never default_server, never edit Mega Hub)…"
          chmod +x deploy/install-trace-vhost.sh
          deploy/install-trace-vhost.sh "$REMOTE_DIR"
          echo "✅ Pyyol Eye up on :3100/:3110; named vhost must win Host trace.pyyol.com."
          ENDSSH

      - name: Keep Cloudflare origin for trace.pyyol.com on :443
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN: ${{ vars.DOMAIN || 'pyyol.com' }}
          TRACE_PUBLIC_PORT: "443"
        run: python3 tracing/deploy/cloudflare-trace-origin.py

      - name: Confirm https://trace.pyyol.com is Pyyol Eye (not Mega Hub)
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 8); do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' -m 20 -A 'pyyol-deploy-check' https://trace.pyyol.com/ || echo 000)"
            title="$(python3 -c 'import re,sys; t=open(sys.argv[1],errors="replace").read(); m=re.search(r"<title[^>]*>(.*?)</title>",t,re.I|re.S); print((m.group(1) if m else "")[:120])' "$body")"
            echo "try $i: HTTP $code title=$title"
            if grep -qiE 'Pyyol Eye|Pyyol Lens' "$body" && ! grep -qi 'Mega Hub' "$body"; then
              echo "✅ public hostname serves Pyyol Eye"
              rm -f "$body"
              ok=1
              break
            fi
            rm -f "$body"
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::https://trace.pyyol.com is still not Pyyol Eye (still Mega Hub or an error page)."
            echo "If the VPS installer logged that the named vhost won on :443, wait for Cloudflare to pick it up."
            echo "If it did not: Cloudflare Dashboard → pyyol.com → Rules → Origin Rules is NOT the first fix;"
            echo "the origin nginx must have server_name trace.pyyol.com (same as admin.pyyol.com)."
            echo "Only if that nginx cannot take a vhost: Hostinger hPanel → VPS → Firewall → allow TCP 3110,"
            echo "then Origin Rule hostname equals trace.pyyol.com → Destination port 3110, SSL mode Full (not Strict)."
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "### Pyyol Eye deployed ✅"
            echo "- Images pulled (no VPS build). ClickHouse healthy, migrations applied, ingest(8081)+query(8082)+web(:3100/:3110) serving."
            echo "- On the shared \`pyyol\` network: arena → pyyol-lens-ingest:8081, admin/web → pyyol-lens-query:8082."
            echo "- nginx named vhost \`trace.pyyol.com\` → 127.0.0.1:3100 (never default_server). Cloudflare stays on origin :443, same as admin. Mega Hub keeps its own hostname."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_deploy tracing/deploy/.env /tmp/tracing-deploy.tar.gz
