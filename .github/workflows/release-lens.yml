name: release-lens

# Publishes @pyyol-lens/nodejs to npm on a `lens-vX.Y.Z` tag using NPM_TOKEN.
# workflow_dispatch with dry_run (default true) only runs npm publish --dry-run.
on:
  push:
    tags: ["lens-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run only (no real publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracing/sdk/nodejs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm test
      - name: Assert tag == package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#lens-v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/lens-v')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
