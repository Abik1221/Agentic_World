name: release-js

# Publishes the pyyol JS/TS SDK to npm on a `js-vX.Y.Z` tag via npm TRUSTED
# PUBLISHING (OIDC) — no stored token. Parity with release-python.yml's PyPI OIDC.
# A workflow_dispatch run does `npm publish --dry-run` only (dry_run defaults true).
#
# One-time setup (already done for pyyol):
#   npmjs.com → the `pyyol` package → Settings/Access → Trusted Publisher →
#   GitHub Actions: owner `Abik1221`, repo `Agentic_World`, workflow `release-js.yml`.
# The old NPM_TOKEN secret is no longer used and can be deleted.
#
# Notes:
#   - Requires npm >= 11.5.1 for OIDC, so we upgrade npm before publishing (the
#     Node 22 runner ships npm 10.x).
#   - This repo is PRIVATE, so npm skips provenance attestation (a known, harmless
#     limitation); trusted publishing itself still works.
on:
  push:
    tags: ["js-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run only (no real publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — token-less trusted publishing
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.1 is required for OIDC trusted publishing.
      - name: Upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Full test suite (fail closed)
        run: npm test
      - name: Assert tag == package.json version and SDK_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#js-v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          npm run build
          node -e "import('./dist/version.js').then(m=>{if(m.SDK_VERSION!==require('./package.json').version){console.error('::error::SDK_VERSION drift');process.exit(1)}})"
      - name: Pack + assert tests excluded, LICENSE included
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "const f=require('/tmp/pack.json')[0].files.map(x=>x.path); const t=f.filter(p=>/test/.test(p)); if(t.length){console.error('::error::test files leaked:',t);process.exit(1)} if(!f.includes('LICENSE')){console.error('::error::LICENSE missing');process.exit(1)}"
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run
      - name: Publish to npm (OIDC trusted publishing)
        if: startsWith(github.ref, 'refs/tags/js-v')
        run: npm publish --access public
