# Publishes a completed lab benchmark to the public research board.
#
# Two jobs, deliberately separate:
#
#   seed  — replays a COMMITTED dataset onto the research board. Deterministic, costs
#           nothing, and is the job that makes a run visible after a deploy. Safe to
#           re-run: it upserts on (board, day, model).
#   run   — plays NEW matches against real providers. Costs real money, so it is
#           manual-dispatch only and never fires on push or on a schedule.
#
# The provider key is read from the PYYOL_PROVIDER_KEY secret and is never committed.
# There is no fallback to a free key: a benchmark that silently degrades to a different
# model tier when a secret is missing publishes numbers for a model nobody selected.
# Missing secret is a hard failure.
name: research-board

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "research dataset directory under research/"
        required: true
        default: goofspiel-trials-2026-08-20
      play_new_matches:
        description: "Play NEW paid matches (costs money). Leave false to only seed."
        type: boolean
        required: true
        default: false
      matches_per_pairing:
        description: "With play_new_matches: how many matches per pairing"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  seed:
    name: seed the research board
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # Fail before touching the database if the dataset is not there, so a typo in the
      # input does not read as "the run had no results".
      - name: check the dataset exists
        run: |
          d="research/${{ inputs.dataset }}"
          test -f "$d/matches.json" || { echo "::error::$d/matches.json not found"; exit 1; }
          echo "matches: $(python3 -c "import json;print(len(json.load(open('$d/matches.json'))))")"

      # Dry run first and keep the output in the log. The board it is about to write is
      # then reviewable from the Actions run alone, without database access.
      - name: preview the board
        working-directory: backend
        run: go run ./cmd/seed-research -data "../research/${{ inputs.dataset }}/matches.json" -dry-run

      - name: seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          go run ./cmd/seed-research \
            -data "../research/${{ inputs.dataset }}/matches.json" \
            -board research

  play:
    name: play new paid matches
    if: ${{ inputs.play_new_matches }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # Refuse rather than fall back. See the header.
      - name: require the provider key
        env:
          PYYOL_PROVIDER_KEY: ${{ secrets.PYYOL_PROVIDER_KEY }}
        run: |
          test -n "$PYYOL_PROVIDER_KEY" || {
            echo "::error::PYYOL_PROVIDER_KEY is not set. This job plays paid matches and"
            echo "::error::will not substitute a free-tier model for a paid one."
            exit 1; }

      - name: build the harness
        working-directory: backend
        run: go build -o .lab-gamelab ./cmd/gamelab

      # Deliberately NOT wired to a live arena here. Playing matches needs the full stack
      # (postgres, redis, the arena server and reachable agent endpoints), which this
      # repo brings up in backend-e2e.yml. Wiring this to production is a separate change
      # and is left explicit rather than half-done: a benchmark job that appears to run
      # but plays nothing is worse than one that says it is not connected.
      - name: not yet connected to a live arena
        run: |
          echo "::warning::The harness builds, but this job does not yet point at a live arena."
          echo "::warning::Run the benchmark from the lab (see research/README) and commit the"
          echo "::warning::dataset, then use the seed job to publish it."
          exit 1
