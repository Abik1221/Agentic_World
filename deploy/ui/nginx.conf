server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cheap liveness endpoint for the container healthcheck / CI smoke test.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Serve the OpenAPI spec with a sensible content type.
    location = /openapi.yaml {
        default_type application/yaml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
