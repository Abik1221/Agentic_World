# Required by the api/admin/app vhosts for WebSocket upgrades. The $connection_upgrade
# variable must be defined in the http {} context, so place this file in
# /etc/nginx/conf.d/ (loaded inside http) — NOT in a server block.
#
#   sudo cp websocket-upgrade.conf /etc/nginx/conf.d/websocket-upgrade.conf
#
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
