# REQUIRES deploy/nginx/websocket-upgrade.conf in /etc/nginx/conf.d/ (defines $connection_upgrade).
# api.pyyol.com — Agent Arena backend API.
#
# Fronts the arena server published on 127.0.0.1:8091 (see backend/deploy/
# docker-compose.prod.yml, ARENA_PORT). SSE spectator + long-poll match state need
# buffering off + long read timeouts. Place in sites-available, symlink to
# sites-enabled, then: certbot --nginx -d api.pyyol.com
server {
    listen 80; listen [::]:80;
    server_name api.pyyol.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name api.pyyol.com;
    ssl_certificate     /etc/letsencrypt/live/api.pyyol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pyyol.com/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (spectator) + long-poll (match state): stream, don't buffer.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # WebSocket (agent gateway) upgrade support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
