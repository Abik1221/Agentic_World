run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosimple
    - revive
    - gosec
    - sqlclosecheck
    - bodyclose
    - misspell
    - gocritic

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
  gosec:
    excludes:
      - G115 # integer overflow conversions are reviewed at money boundaries explicitly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files may use less strict patterns.
    - path: _test\.go
      linters: [gosec, errcheck]
