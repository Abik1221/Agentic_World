[build-system]
# setuptools >= 77 for the PEP 639 SPDX `license` string + `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyyol"
# Single source of truth: the version lives in pyyol/__init__.py (__version__).
# setuptools reads it via AST (no import), so building never pulls `websockets`.
dynamic = ["version"]
description = "Official Python SDK for pyyol — run AI game-playing agents locally over a WebSocket (Beta)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# TODO(email): add `email = "..."` once a public contact address is chosen.
authors = [{ name = "Pyyol" }]
keywords = ["agent", "arena", "pyyol", "goofspiel", "mafia"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# The local-runtime connector dials out over a WebSocket; that is the one
# runtime dependency. Everything else (signing, models, CLI) is stdlib-only.
dependencies = ["websockets>=13"]

[project.urls]
# Source lives in a private repo; users are pointed at the public site + docs.
Homepage = "https://pyyol.com"
Documentation = "https://pyyol.com/docs"
Changelog = "https://pyyol.com/docs/changelog"
Issues = "https://pyyol.com/support"

[project.scripts]
pyyol = "pyyol.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Secure token storage in the OS keychain; the CLI falls back to a 0600 file
# when it is not installed (see credentials.py).
keyring = ["keyring>=24"]

[tool.setuptools.dynamic]
version = { attr = "pyyol.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pyyol*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type checkers see our annotations, plus the
# engine-generated game rules (rules/games.md + llms-full.txt) so an LLM/agent that
# only has the installed package still gets the full, current rules for all 3 games.
pyyol = ["py.typed", "rules/*.md", "rules/*.txt", "skill/*.md", "skill/references/*.md", "skill/references/games/*.md", "skill/references/templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# EXPLICIT, not extend-select. The previous config extended ruff's defaults and stated in a
# comment that pyupgrade was "intentionally not enabled" — but extend-select can only ADD, and a
# later ruff release moved UP into the default set. The rule the comment forbade had been running
# for some time, and nothing failed, because the intent lived in prose the tool never read.
#
# A pinned list means the enforced set changes when THIS file changes and not when a dependency
# ships a new default.
#
#   B, BLE  bugbear and blind-except, matching the existing `# noqa: BLE001`
#   UP      safe now that the floor is 3.10; it was the 3.9 floor that made it unsafe
#   S       bandit. Kept because this SDK handles API keys, HMAC turn proofs and signing keys,
#           and S310 caught a real one: urlopen honoured any scheme from a user-supplied API
#           base, so `file:///etc/passwd` was a readable "API response". See _urlopen in cli.py.
select = ["E4", "E7", "E9", "F", "B", "BLE", "UP", "S"]

# S110 (try-except-pass) is deliberate in the instrumentation paths: telemetry must never break a
# live match, so a failed emit is swallowed by design. Ignored with the reason recorded rather
# than left to fire and be tuned out — a lint pile everyone scrolls past protects nothing.
ignore = [
  "S110",
  # S310 flags urlopen AND urllib.request.Request, so it fires on every request CONSTRUCTION
  # even though the only code that opens a socket is _urlguard.urlopen, which checks the scheme
  # first. Rather than scatter ~19 noqa comments (which would also silence a genuinely unguarded
  # call added later in the same file), the rule is off here and replaced by
  # tests/test_url_guard.py::test_no_module_calls_urlopen_directly — a stronger check, because it
  # fails on the thing that actually matters instead of on the shape of a constructor call.
  "S310",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately catch broad exceptions and re-raise without chaining.
# S101 assert is the point of a test; S105/S106 are fixture strings named "access_token" and
# friends, not credentials; S603 is a subprocess call on a path this repo controls.
"tests/*" = ["B904", "BLE001", "S101", "S105", "S106", "S603"]

[tool.mypy]
# Matches requires-python. These were out of step while the floor was 3.9: mypy analysed at
# 3.10, so nothing in CI actually verified the 3.9 support the metadata advertised.
python_version = "3.10"
files = ["pyyol"]
# Pragmatic strictness for a shipped-but-not-fully-annotated SDK: type-check what IS
# annotated and flag dead ignores/casts, but don't fail on third-party stubs. The
# `py.typed` guarantee is now actually verified in CI. Tightened over time.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
