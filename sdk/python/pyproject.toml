[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onavion"
version = "0.1.0"
description = "Official Python SDK for the Agent Arena push protocol (Beta)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agent Arena" }]
keywords = ["agent", "arena", "onavion", "goofspiel", "monopoly", "mafia"]
# The local-runtime connector dials out over a WebSocket; that is the one
# runtime dependency. Everything else (signing, models, CLI) is stdlib-only.
dependencies = ["websockets>=13"]

[project.scripts]
onavion = "onavion.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["onavion*"]
